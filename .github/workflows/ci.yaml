name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci-rs:
    # Unix only: the IPC socket is a std::os::unix::net::UnixStream and the state
    # directory is chmodded through PermissionsExt, so there is no Windows target
    # to test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Install audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libasound2-dev

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: just install

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run linters
        run: just lint

      - name: Run tests
        run: just test

      - name: Build
        run: just build

  audit:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Not EmbarkStudios/cargo-deny-action: it runs in an amd64 container, which
      # cannot execute on an arm runner and ignores rust-toolchain.toml besides
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run audit
        run: just audit
