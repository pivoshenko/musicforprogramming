[package]
name = "mfp-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Terminal interface and headless CLI for the musicforprogramming player"

# The interface and the headless transport commands are one binary: `mfp` with no
# subcommand draws the interface, `mfp pause` acts and exits.
[[bin]]
name = "mfp"
path = "src/main.rs"

[dependencies]
mfp-core.workspace = true

anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
flate2.workspace = true
libc.workspace = true
ratatui.workspace = true
# Blocking on purpose: `self update` and the version check run on ordinary threads, and a
# second async runtime inside a synchronous client would exist to serve two HTTP requests
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
